# Versions the released SVC results were produced with.
#   conda env create -f environment.yml
#   conda activate SVC
name: SVC
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10.19          # any 3.10.x works; this is the interpreter the results were produced on
  - pip
  - pip:
      # required by the SVC package and the per-dataset scripts
      - torch==2.5.1
      - einops==0.8.1
      - local-attention==1.9.15
      - numpy==1.26.4
      - scipy==1.12.0
      - scikit-learn==1.7.2
      - pandas==2.2.3
      - anndata==0.11.4
      - tqdm==4.66.5
      - natsort==8.4.0
      # used by the figure notebooks in github.com/aster-ww/SVC-reproducibility
      - ipykernel==7.1.0
      - matplotlib==3.9.2
      - seaborn==0.13.2
      - networkx==3.4.2
      - umap-learn==0.5.6
      - scanpy==1.10.3
      - openpyxl==3.1.5
